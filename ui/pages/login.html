<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOC Portal — Safaricom Ethiopia</title>
    <script src="/assets/vendor/tailwindcss.js" onerror="this.onerror=null;this.src='https://cdn.tailwindcss.com'"></script>
    <link rel="stylesheet" href="/assets/vendor/fontawesome/css/all.min.css" onerror="this.onerror=null;this.href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css'">
    <script>
        tailwind.config = {
            theme: { extend: { colors: { safaricomGreen: '#00B050', safaricomRed: '#FF0000' } } }
        }
    </script>
    <style>
        @keyframes slide-up { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
        @keyframes shake { 0%,100%{transform:translateX(0)} 20%,60%{transform:translateX(-6px)} 40%,80%{transform:translateX(6px)} }
        @keyframes float-dot {
            0%, 100% { transform: translateY(0px) translateX(0px); opacity: 0.08; }
            33%       { transform: translateY(-25px) translateX(12px); opacity: 0.18; }
            66%       { transform: translateY(12px) translateX(-8px); opacity: 0.1; }
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            background-color: #0d1117;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        .dot { position:absolute; border-radius:50%; animation: float-dot linear infinite; pointer-events:none; }
        .animate-slide-up { animation: slide-up 0.5s ease both; }
        .animate-shake { animation: shake 0.4s ease; }

        /* top-right link */
        .top-link {
            position: fixed;
            top: 16px;
            right: 24px;
            font-size: 12px;
            color: #8b949e;
            z-index: 10;
        }
        .top-link a {
            color: #58a6ff;
            text-decoration: none;
            border: 1px solid #30363d;
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 12px;
            transition: background 0.2s, color 0.2s;
        }
        .top-link a:hover { background: #161b22; color: #79c0ff; }

        /* card */
        .login-card {
            background: rgba(22, 27, 34, 0.92);
            border: 1px solid #30363d;
            border-radius: 10px;
            padding: 32px 32px 28px;
            width: 340px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.6);
        }

        .login-title {
            text-align: center;
            font-size: 22px;
            font-weight: 300;
            color: #e6edf3;
            margin-bottom: 24px;
            letter-spacing: 0.5px;
        }

        .field-label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #8b949e;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            margin-bottom: 6px;
        }

        .field-wrap { margin-bottom: 14px; position: relative; }
        .field-input {
            width: 100%;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #e6edf3;
            font-size: 13px;
            padding: 9px 36px 9px 12px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .field-input:focus {
            border-color: #58a6ff;
            box-shadow: 0 0 0 3px rgba(88,166,255,0.12);
        }
        .field-input::placeholder { color: #484f58; }

        .eye-btn {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: #484f58;
            padding: 0;
            font-size: 13px;
            line-height: 1;
        }
        .eye-btn:hover { color: #8b949e; }

        .forgot-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
            margin-top: -6px;
        }
        .remember-label { font-size: 12px; color: #8b949e; display: flex; align-items: center; gap: 6px; cursor: pointer; }
        .remember-label input { accent-color: #58a6ff; }
        .forgot-link { font-size: 12px; color: #58a6ff; text-decoration: none; background: none; border: none; cursor: pointer; padding: 0; }
        .forgot-link:hover { text-decoration: underline; color: #79c0ff; }

        .error-box {
            background: rgba(248,81,73,0.12);
            border: 1px solid rgba(248,81,73,0.4);
            border-radius: 6px;
            padding: 10px 12px;
            font-size: 12px;
            color: #f85149;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .error-box.hidden { display: none !important; }

        .caps-warn { font-size: 11px; color: #d29922; margin-top: 5px; display: none; align-items: center; gap: 5px; }
        .caps-warn.visible { display: flex; }

        .btn-login {
            width: 100%;
            padding: 10px;
            background: #f0883e;
            border: none;
            border-radius: 6px;
            color: #fff;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.2s, box-shadow 0.2s, transform 0.15s;
            position: relative;
            overflow: hidden;
        }
        .btn-login:hover { background: #e07830; box-shadow: 0 4px 20px rgba(240,136,62,0.4); transform: translateY(-1px); }
        .btn-login:active { transform: translateY(0); }
        .btn-login:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        .divider {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 20px 0;
        }
        .divider hr { flex: 1; border: none; border-top: 1px solid #21262d; }
        .divider span { font-size: 11px; color: #484f58; white-space: nowrap; }

        .social-row { display: flex; gap: 10px; }
        .social-btn {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 9px;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #8b949e;
            font-size: 12px;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.2s, border-color 0.2s, color 0.2s;
        }
        .social-btn:hover { background: #1c2128; border-color: #484f58; color: #e6edf3; }
        .social-btn i { font-size: 14px; }
        .social-btn .g-icon { color: #ea4335; }
        .social-btn .fb-icon { color: #1877f2; }

        .page-footer { text-align: center; font-size: 10px; color: #30363d; margin-top: 20px; }

        /* modal inputs */
        .glass-input {
            width: 100%;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #e6edf3;
            font-size: 13px;
            padding: 9px 12px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .glass-input:focus { border-color: #58a6ff; box-shadow: 0 0 0 3px rgba(88,166,255,0.12); }
        .glass-input::placeholder { color: #484f58; }

        /* modal */
        .modal-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 10px;
            padding: 24px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 16px 60px rgba(0,0,0,0.7);
        }
        .modal-title { color: #e6edf3; font-weight: 600; font-size: 16px; }
        .modal-sub { color: #8b949e; font-size: 12px; margin-top: 6px; margin-bottom: 16px; }
        .modal-label { display: block; font-size: 11px; font-weight: 600; color: #8b949e; text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 5px; }
        .modal-field { margin-bottom: 12px; }
        .btn-secondary {
            width: 100%;
            padding: 9px;
            background: transparent;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #e6edf3;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-secondary:hover { background: #21262d; border-color: #484f58; }
        .btn-reset {
            width: 100%;
            padding: 10px;
            background: #f0883e;
            border: none;
            border-radius: 6px;
            color: #fff;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-reset:hover { background: #e07830; }
        .btn-reset:disabled { opacity: 0.6; cursor: not-allowed; }
        .reset-error { display: none; background: rgba(248,81,73,0.12); border: 1px solid rgba(248,81,73,0.4); border-radius: 6px; padding: 9px 12px; font-size: 12px; color: #f85149; margin-bottom: 10px; }
        .reset-error.visible { display: block; }
        .reset-ok { display: none; background: rgba(63,185,80,0.12); border: 1px solid rgba(63,185,80,0.4); border-radius: 6px; padding: 9px 12px; font-size: 12px; color: #3fb950; margin-bottom: 10px; }
        .reset-ok.visible { display: block; }
    </style>

    <script>
        fetch('/api/v1/auth/me')
            .then(response => {
                if (response.ok) return response.json();
                throw new Error();
            })
            .then(user => {
                sessionStorage.setItem('nocLoggedIn', 'true');
                sessionStorage.setItem('nocUsername', user.username);
                sessionStorage.setItem('nocUserRole', user.role);
                sessionStorage.setItem('nocDisplayName', user.full_name);
                window.location.replace('/');
            })
            .catch(() => {});
    </script>

</head>
<body style="margin:0; min-height:100vh; background-color:#0d1117; display:flex; flex-direction:column; align-items:center; justify-content:center; position:relative; overflow:hidden;">

    <!-- Animated background dots -->
    <div id="bgDots" aria-hidden="true"></div>

    <!-- Top-right: Create account link -->
    <div class="top-link">
        Don't have an account? <a href="#">Create your account</a>
    </div>

    <!-- Safaricom Logo (top of page, matches second image) -->
    <div class="animate-slide-up" style="position:relative;z-index:10;text-align:center;margin-bottom:28px;user-select:none;">
        <!-- Logo mark + wordmark row -->
        <div style="display:inline-flex;align-items:center;gap:4px;">
            <!-- Red swoosh ellipse -->
            <svg width="54" height="54" viewBox="0 0 54 54" fill="none" xmlns="http://www.w3.org/2000/svg" style="flex-shrink:0;">
                <ellipse cx="27" cy="27" rx="26" ry="26" fill="none"/>
                <path d="M6 27 C6 14, 20 4, 34 8 C44 11, 50 20, 46 30 C42 40, 28 46, 16 40 C8 36, 4 32, 6 27Z"
                      fill="none" stroke="#e8002d" stroke-width="5" stroke-linecap="round"/>
            </svg>
            <!-- Wordmark -->
            <div style="display:flex;flex-direction:column;align-items:flex-start;line-height:1;">
                <span style="font-size:36px;font-weight:800;color:#4caf50;letter-spacing:-0.5px;font-family:'Segoe UI',sans-serif;">Safaricom</span>
                <span style="font-size:14px;font-weight:600;color:#4caf50;letter-spacing:1px;font-family:'Nyala','Ebrima','Segoe UI',sans-serif;">ሳፋሪኮም</span>
            </div>
        </div>
        <!-- Divider line -->
        <div style="margin-top:18px;height:1px;background:linear-gradient(to right,transparent,#2a2a2a,transparent);"></div>
    </div>

    <!-- Login card wrapper -->
    <div class="animate-slide-up" style="position:relative; z-index:10; width:100%; max-width:380px; padding:0 16px;">

        <div class="login-card">
            <h1 class="login-title">Login</h1>

            <form id="loginForm" onsubmit="handleLogin(event)">

                <!-- Email / Username -->
                <div class="field-wrap">
                    <label class="field-label">Email Address</label>
                    <input type="text" id="username" autocomplete="username"
                        class="field-input" placeholder="info@example.com" required>
                </div>

                <!-- Password -->
                <div class="field-wrap">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
                        <label class="field-label" style="margin-bottom:0;">Password</label>
                        <button type="button" class="forgot-link" onclick="openResetModal()">Forgot Password?</button>
                    </div>
                    <input type="password" id="password" autocomplete="current-password"
                        class="field-input" placeholder="Enter your password" required>
                    <button type="button" class="eye-btn" onclick="togglePassword()" tabindex="-1">
                        <i id="eyeIcon" class="fa-solid fa-eye"></i>
                    </button>
                    <div id="capsWarning" class="caps-warn">
                        <i class="fa-solid fa-triangle-exclamation"></i> Caps Lock is on
                    </div>
                </div>

                <!-- Remember me -->
                <div class="forgot-row">
                    <label class="remember-label">
                        <input type="checkbox" id="rememberMe"> Remember me
                    </label>
                </div>

                <!-- Error -->
                <div id="errorBox" class="error-box hidden" role="alert" aria-live="assertive">
                    <i class="fa-solid fa-circle-exclamation"></i>
                    <span id="errorText">Invalid username or password. Try again.</span>
                </div>

                <!-- Submit -->
                <button type="submit" id="loginBtn" class="btn-login" aria-label="Sign In to NOC Portal">
                    <span id="btnText">LOGIN</span>
                </button>
            </form>

        </div>

        <p class="page-footer">© 2026 Safaricom Ethiopia PLC — NOC Operations</p>
    </div>

    <script>
        async function handleLogin(e) {
            e.preventDefault();
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            const username = usernameInput.value.trim().toLowerCase();
            const password = passwordInput.value;
            const errorBox = document.getElementById('errorBox');
            const errorText = document.getElementById('errorText');
            const button = document.getElementById('loginBtn');
            const btnText = document.getElementById('btnText');
            button.disabled = true;
            const originalBtn = btnText.textContent;
            btnText.textContent = 'Signing in…';
            errorBox.classList.add('hidden');

            try {
                const response = await fetch('/api/v1/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const result = await response.json().catch(() => ({}));
                if (!response.ok) {
                    let detail = result.detail;
                    if (Array.isArray(detail)) detail = detail.map(i => i.msg).join('; ');
                    if (response.status === 429) {
                        const retry = response.headers.get('Retry-After');
                        detail = 'Too many attempts. Try again' + (retry ? ' in ' + retry + 's' : ' later') + '.';
                    }
                    throw new Error(detail || 'Sign-in failed.');
                }
                if (document.getElementById('rememberMe').checked) {
                    localStorage.setItem('nocRememberedUsername', username);
                } else {
                    localStorage.removeItem('nocRememberedUsername');
                }
                sessionStorage.setItem('nocLoggedIn', 'true');
                sessionStorage.setItem('nocUsername', result.user.username);
                sessionStorage.setItem('nocUserRole', result.user.role);
                sessionStorage.setItem('nocDisplayName', result.user.full_name);
                btnText.textContent = 'Authenticated — Redirecting…';
                window.location.replace('/');
            } catch (error) {
                if (errorText) errorText.textContent = error.message || 'Unable to sign in. Please try again.';
                errorBox.classList.remove('hidden');
                errorBox.classList.add('animate-shake');
                setTimeout(() => errorBox.classList.remove('animate-shake'), 500);
                passwordInput.value = '';
                passwordInput.focus();
            } finally {
                button.disabled = false;
                if (btnText.textContent === 'Signing in…') btnText.textContent = originalBtn;
            }
        }

        function togglePassword() {
            const pw = document.getElementById('password');
            const icon = document.getElementById('eyeIcon');
            if (pw.type === 'password') {
                pw.type = 'text';
                icon.className = 'fa-solid fa-eye-slash';
            } else {
                pw.type = 'password';
                icon.className = 'fa-solid fa-eye';
            }
        }

        // ─── Reset password modal ────────────────────────────────────────────────
        function openResetModal() {
            const modal = document.getElementById('resetModal');
            modal.style.display = 'flex';
            document.body.style.overflow = 'hidden';
            setTimeout(() => { const f = document.getElementById('resetToken'); if (f) f.focus(); }, 50);
        }
        function closeResetModal() {
            document.getElementById('resetModal').style.display = 'none';
            document.body.style.overflow = '';
            document.getElementById('resetForm').reset();
            document.getElementById('requestResetForm').reset();
            const rs = document.getElementById('requestStatus');
            if (rs) { rs.style.display = 'none'; rs.textContent = ''; }
            document.getElementById('resetError').classList.remove('visible');
            document.getElementById('resetSuccess').classList.remove('visible');
        }

        async function handleRequestReset(e) {
            e.preventDefault();
            const ident = document.getElementById('requestIdentifier').value.trim();
            const statusBox = document.getElementById('requestStatus');
            const btn = document.getElementById('requestBtn');
            const btnTxt = document.getElementById('requestBtnText');
            statusBox.style.display = 'none';
            btn.disabled = true;
            btnTxt.textContent = 'Sending…';
            try {
                const response = await fetch('/api/v1/auth/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ identifier: ident })
                });
                const result = await response.json().catch(() => ({}));
                if (!response.ok) {
                    let detail = result.detail;
                    if (Array.isArray(detail)) detail = detail.map(i => i.msg).join('; ');
                    if (response.status === 429) {
                        const retry = response.headers.get('Retry-After');
                        detail = 'Too many requests. Try again' + (retry ? ' in ' + retry + 's' : ' later') + '.';
                    }
                    throw new Error(detail || 'Request failed.');
                }
                statusBox.textContent = result.message || 'If an account exists, a reset link has been sent.';
                statusBox.style.display = 'block';
                statusBox.style.color = '#3fb950';
            } catch (error) {
                statusBox.textContent = error.message || 'Unable to request reset.';
                statusBox.style.display = 'block';
                statusBox.style.color = '#f85149';
            } finally {
                btn.disabled = false;
                btnTxt.textContent = 'Send reset link';
            }
        }

        async function handleReset(e) {
            e.preventDefault();
            const token = document.getElementById('resetToken').value.trim();
            const newPassword = document.getElementById('resetNewPassword').value;
            const confirmPassword = document.getElementById('resetConfirmPassword').value;
            const errBox = document.getElementById('resetError');
            const okBox = document.getElementById('resetSuccess');
            const btn = document.getElementById('resetBtn');
            const btnTxt = document.getElementById('resetBtnText');
            errBox.classList.remove('visible');
            okBox.classList.remove('visible');

            if (newPassword !== confirmPassword) {
                errBox.textContent = 'Passwords do not match.';
                errBox.classList.add('visible');
                return;
            }
            btn.disabled = true;
            btnTxt.textContent = 'Resetting…';
            try {
                const response = await fetch('/api/v1/auth/reset-password/confirm', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, new_password: newPassword })
                });
                const result = await response.json().catch(() => ({}));
                if (!response.ok) {
                    let detail = result.detail;
                    if (Array.isArray(detail)) detail = detail.map(i => i.msg).join('; ');
                    throw new Error(detail || 'Reset failed.');
                }
                okBox.textContent = 'Password reset successful. You can now sign in.';
                okBox.classList.add('visible');
                document.getElementById('resetForm').reset();
                setTimeout(() => { closeResetModal(); document.getElementById('username').focus(); }, 1500);
            } catch (error) {
                errBox.textContent = error.message || 'Unable to reset password.';
                errBox.classList.add('visible');
            } finally {
                btn.disabled = false;
                btnTxt.textContent = 'Reset password';
            }
        }

        // Caps Lock
        (function initCapsLock() {
            const pw = document.getElementById('password');
            const warn = document.getElementById('capsWarning');
            if (!pw || !warn) return;
            function check(e) {
                const on = e.getModifierState && e.getModifierState('CapsLock');
                warn.classList.toggle('visible', on);
            }
            pw.addEventListener('keydown', check);
            pw.addEventListener('keyup', check);
            pw.addEventListener('focus', check);
        })();

        // Auto-fill remembered username
        (function initRemembered() {
            const saved = localStorage.getItem('nocRememberedUsername');
            if (saved) {
                const u = document.getElementById('username');
                if (u) { u.value = saved; document.getElementById('rememberMe').checked = true; }
            }
        })();

        window.addEventListener('DOMContentLoaded', () => {
            const u = document.getElementById('username');
            if (u && !u.value) u.focus();
        });

        document.addEventListener('keydown', e => { if (e.key === 'Escape') closeResetModal(); });

        // Auto-open reset modal if reset_token in URL
        (function initResetTokenFromUrl() {
            const params = new URLSearchParams(window.location.search);
            const token = params.get('reset_token');
            if (token) {
                openResetModal();
                const field = document.getElementById('resetToken');
                if (field) field.value = token;
                if (window.history && window.history.replaceState)
                    window.history.replaceState({}, '', window.location.pathname);
            }
        })();

        // Animated background dots
        (function spawnDots() {
            const container = document.getElementById('bgDots');
            const colors = ['rgba(88,166,255,0.12)', 'rgba(63,185,80,0.1)', 'rgba(240,136,62,0.08)', 'rgba(255,255,255,0.05)'];
            for (let i = 0; i < 18; i++) {
                const dot = document.createElement('div');
                const size = Math.random() * 160 + 30;
                dot.className = 'dot';
                dot.style.cssText = `
                    width:${size}px; height:${size}px;
                    left:${Math.random()*100}%; top:${Math.random()*100}%;
                    background: radial-gradient(circle, ${colors[i%colors.length]} 0%, transparent 70%);
                    animation-duration: ${10 + Math.random()*16}s;
                    animation-delay: ${-Math.random()*10}s;
                    filter: blur(${size*0.35}px);
                `;
                container.appendChild(dot);
            }
        })();
    </script>

    <!-- Reset password modal -->
    <div id="resetModal" style="display:none; position:fixed; inset:0; z-index:50; align-items:center; justify-content:center; padding:16px;"
         role="dialog" aria-modal="true" aria-labelledby="resetTitle">
        <div style="position:absolute;inset:0;background:rgba(1,4,9,0.85);backdrop-filter:blur(4px);" onclick="closeResetModal()"></div>
        <div class="modal-card animate-slide-up" style="position:relative;z-index:1;">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;">
                <h2 id="resetTitle" class="modal-title">Reset password</h2>
                <button type="button" onclick="closeResetModal()"
                        style="background:none;border:none;color:#8b949e;cursor:pointer;font-size:16px;" aria-label="Close">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <p class="modal-sub">Enter your username or email to receive a reset link, or paste a token you already have.</p>

            <!-- Request reset -->
            <form id="requestResetForm" onsubmit="handleRequestReset(event)"
                  style="margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid #21262d;">
                <div class="modal-field">
                    <label class="modal-label">Username or email</label>
                    <input type="text" id="requestIdentifier" required autocomplete="username"
                        class="glass-input" placeholder="your.username or you@example.com">
                </div>
                <div id="requestStatus" style="display:none;font-size:12px;font-weight:600;margin-bottom:10px;"></div>
                <button type="submit" id="requestBtn" class="btn-secondary">
                    <i class="fa-solid fa-envelope"></i>
                    <span id="requestBtnText">Send reset link</span>
                </button>
            </form>

            <!-- Reset with token -->
            <form id="resetForm" onsubmit="handleReset(event)">
                <div class="modal-field">
                    <label class="modal-label">Reset token</label>
                    <input type="text" id="resetToken" required autocomplete="off"
                        class="glass-input" style="font-family:monospace;"
                        placeholder="Paste the token from your administrator">
                </div>
                <div class="modal-field">
                    <label class="modal-label">New password</label>
                    <input type="password" id="resetNewPassword" required minlength="12" maxlength="72"
                        autocomplete="new-password" class="glass-input" placeholder="At least 12 characters">
                </div>
                <div class="modal-field">
                    <label class="modal-label">Confirm password</label>
                    <input type="password" id="resetConfirmPassword" required minlength="12" maxlength="72"
                        autocomplete="new-password" class="glass-input" placeholder="Repeat new password">
                </div>
                <div id="resetError" class="reset-error" role="alert" aria-live="assertive"></div>
                <div id="resetSuccess" class="reset-ok" role="status" aria-live="polite"></div>
                <button type="submit" id="resetBtn" class="btn-reset">
                    <i class="fa-solid fa-key"></i>
                    <span id="resetBtnText">Reset password</span>
                </button>
            </form>
        </div>
    </div>

</body>
</html>

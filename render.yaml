databases:
  - name: noc-portal-db
    databaseName: noc_portal
    user: noc_portal
    plan: free

services:
  - type: web
    name: noc-portal
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    preDeployCommand: "alembic -c server/alembic.ini upgrade head"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips '*'"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: noc-portal-db
          property: connectionString
      - key: JWT_SECRET_KEY
        sync: false
      - key: INITIAL_ADMIN_USERNAME
        sync: false
      - key: INITIAL_ADMIN_EMAIL
        sync: false
      - key: INITIAL_ADMIN_FULL_NAME
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      # Set this to the exact hostname Render assigns (e.g. noc-portal.onrender.com).
      # If Render assigns a different name, update here or in the dashboard and redeploy.
      - key: ALLOWED_HOSTS
        sync: false

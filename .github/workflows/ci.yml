name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://ci:ci@127.0.0.1:5432/ci
      JWT_SECRET_KEY: ci-only-secret-that-is-longer-than-thirty-two-characters
      COOKIE_SECURE: "false"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Check for AI-corruption markers
        run: |
          if git grep -n '" old_text"' -- . ':(exclude).github/workflows/ci.yml' ':(exclude)README.txt'; then
            echo "ERROR: AI-corruption marker found in repository."
            exit 1
          fi

      - name: Check that the app imports cleanly
        run: python -c "from server.application import create_app; create_app()"
      - name: Check for undefined names
        run: python -m ruff check --select F821 server/

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Check single Alembic head
        run: test "$(python -m alembic -c server/alembic.ini heads | wc -l)" -eq 1
      - name: Run backend unit tests
        run: python -m unittest discover -s tests -v

      - name: Run mocked browser tests
        run: python -m pytest ui_tests -q

      - name: Run PostgreSQL integration tests
        run: docker compose -p noc-portal-ci -f compose.integration.yaml run --build --rm integration-tests
        env:
          INITIAL_ADMIN_USERNAME: testadmin
          INITIAL_ADMIN_EMAIL: testadmin@integration.invalid
          INITIAL_ADMIN_FULL_NAME: Integration Test Admin
          INITIAL_ADMIN_PASSWORD: IntegrationAdmin123!

      - name: Start disposable app for browser contract test
        run: docker compose -p noc-portal-ci -f compose.integration.yaml up -d --build integration-db integration-app

      - name: Wait for disposable app
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8001/healthz; then
              exit 0
            fi
            sleep 2
          done
          docker compose -p noc-portal-ci -f compose.integration.yaml logs integration-app integration-db
          exit 1

      - name: Run real-backend browser contract test
        run: python -m pytest ui_tests/test_knowledge_contract.py -q
        env:
          E2E_PORTAL_URL: http://127.0.0.1:8001
          E2E_USERNAME: testadmin
          E2E_PASSWORD: IntegrationAdmin123!

      - name: Remove disposable database and app
        if: always()
        run: docker compose -p noc-portal-ci -f compose.integration.yaml down -v --remove-orphans

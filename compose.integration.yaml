services:
  integration-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: noc_portal_test
      POSTGRES_USER: noc_portal_test
      POSTGRES_PASSWORD: integration-only-password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noc_portal_test -d noc_portal_test"]
      interval: 2s
      timeout: 3s
      retries: 20

  integration-app:
    build:
      context: .
      dockerfile: Dockerfile.integration
    environment:
      APP_ENV: test
      ALLOWED_HOSTS: 127.0.0.1,localhost
      DATABASE_URL: postgresql+psycopg://noc_portal_test:integration-only-password@integration-db:5432/noc_portal_test
      JWT_SECRET_KEY: integration-only-test-secret-not-for-deployment-0001
      COOKIE_SECURE: "false"
      INITIAL_ADMIN_USERNAME: testadmin
      INITIAL_ADMIN_EMAIL: testadmin@integration.invalid
      INITIAL_ADMIN_FULL_NAME: Integration Test Admin
      INITIAL_ADMIN_PASSWORD: IntegrationAdmin123!
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      integration-db:
        condition: service_healthy
    command:
      - sh
      - -c
      - python -m alembic -c server/alembic.ini upgrade head && python -m uvicorn main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  integration-tests:
    build:
      context: .
      dockerfile: Dockerfile.integration
    environment:
      APP_ENV: test
      ALLOWED_HOSTS: 127.0.0.1,localhost
      DATABASE_URL: postgresql+psycopg://noc_portal_test:integration-only-password@integration-db:5432/noc_portal_test
      JWT_SECRET_KEY: integration-only-test-secret-not-for-deployment-0001
      COOKIE_SECURE: "false"
      INITIAL_ADMIN_USERNAME: testadmin
      INITIAL_ADMIN_EMAIL: testadmin@integration.invalid
      INITIAL_ADMIN_FULL_NAME: Integration Test Admin
      INITIAL_ADMIN_PASSWORD: IntegrationAdmin123!
    depends_on:
      integration-db:
        condition: service_healthy
    command:
      - sh
      - -c
      - python -m alembic -c server/alembic.ini upgrade head && python -m unittest discover -s integration_tests -v
